name: instalador (.exe)

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Preparar la carpeta de la app (archivos web y librerías)
        shell: bash
        run: |
          mkdir -p dist/vendor dist/icons
          cp index.html sw.js manifest.webmanifest dist/
          cp icons/*.png dist/icons/
          curl -fsSL https://cdn.tailwindcss.com -o dist/vendor/tailwind.js
          curl -fsSL https://unpkg.com/lucide@latest -o dist/vendor/lucide.min.js

      - name: Instalar herramientas de compilación
        run: npm install

      - name: Compilar el instalador
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Presupuest-Arg-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
